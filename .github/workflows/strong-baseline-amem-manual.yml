name: A-MEM Zero-Cost Manual Smoke

on:
  workflow_dispatch:
    inputs:
      ratio:
        description: "LoCoMo fraction for upstream smoke (keep small)"
        required: false
        default: "0.1"

permissions:
  contents: read

jobs:
  amem-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Capture environment
        run: |
          mkdir -p amem-smoke-artifact
          {
            uname -a
            python --version
            free -h
            df -h
          } | tee amem-smoke-artifact/environment.txt
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama and pull exact declared local model
        run: |
          ollama serve > amem-smoke-artifact/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          ollama pull qwen2.5:3b
          ollama list | tee amem-smoke-artifact/ollama-list.txt
      - name: Clone exact-pinned A-MEM reproduction source
        run: |
          git clone https://github.com/WujiangXu/A-mem.git upstream-amem
          cd upstream-amem
          git checkout 0c8039f28fdcc08189a23c07a3437d9d2482f9c2
          test "$(git rev-parse HEAD)" = "0c8039f28fdcc08189a23c07a3437d9d2482f9c2"
      - name: Install upstream dependencies
        run: python -m pip install -r upstream-amem/requirements.txt
      - name: Run reduced upstream smoke
        working-directory: upstream-amem
        env:
          PYTHONHASHSEED: "17"
        run: |
          /usr/bin/time -v -o ../amem-smoke-artifact/time.txt             python test_advanced_robust.py               --backend ollama               --model qwen2.5:3b               --dataset data/locomo10.json               --ratio "${{ inputs.ratio }}"               --retrieve_k 10               --output ../amem-smoke-artifact/upstream-results.json
      - name: Zero-cost boundary check
        run: |
          test -z "${OPENAI_API_KEY:-}"
          test -z "${ANTHROPIC_API_KEY:-}"
          printf '{"new_monetary_cost_usd":0.0,"paid_api_used":false,"cloud_gpu_used":false}\n' > amem-smoke-artifact/cost.json
      - uses: actions/upload-artifact@v4
        with:
          name: amem-zero-cost-smoke
          path: amem-smoke-artifact/
          if-no-files-found: error
