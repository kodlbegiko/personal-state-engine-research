name: Candidate-v6 Regenerate Pilot Lock

on:
  push:
    branches: [research/personal-state-engine-v0]
    paths:
      - '.github/workflows/candidate-v6-regenerate-pilot-lock.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/personal-state-engine-v0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository
        run: python -m pip install -e .
      - name: Regenerate benchmark lock through repository authority
        run: |
          set -euo pipefail
          python scripts/freeze_pilot_benchmark.py --version pilot-v0.13
          python scripts/verify_benchmark_lock.py --lock benchmarks/pilot/benchmark-lock.json
          cat benchmarks/pilot/benchmark-lock.sha256
      - name: Commit formally regenerated lock
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/pilot/benchmark-lock.json benchmarks/pilot/benchmark-lock.sha256
          if git diff --cached --quiet; then
            echo 'No lock changes generated'
            exit 0
          fi
          git commit -m 'research: regenerate pilot lock for candidate-v6'
          git push origin HEAD:research/personal-state-engine-v0
