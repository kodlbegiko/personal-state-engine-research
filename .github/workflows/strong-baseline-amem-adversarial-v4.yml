name: A-MEM Adversarial-v4 Full

on:
  workflow_dispatch:
  push:
    branches:
      - research/personal-state-engine-v0
    paths:
      - ".github/amem-adversarial-v4-trigger"

permissions:
  contents: write

concurrency:
  group: amem-adversarial-v4-full
  cancel-in-progress: false

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      A_MEM_SOURCE_COMMIT: 0c8039f28fdcc08189a23c07a3437d9d2482f9c2
      EXPECTED_CORPUS_SHA256: 02e3afef1e17d9d8991ea7172cbfc19ad239874c914a088c20e5de6a146f7a1d
      EXPECTED_EMBEDDING_SNAPSHOT: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
      EXPECTED_OLLAMA_DIGEST: 357c53fb659c5076de1d65ccb0b397446227b71a42be9d1603d46168015c9e4b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify full-corpus pre-result protocol and zero-cost boundary
        run: |
          set -euo pipefail
          test "$(sha256sum benchmarks/algorithm-development/adversarial-v4/postfreeze-discrimination.json | awk '{print $1}')" = "$EXPECTED_CORPUS_SHA256"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${ANTHROPIC_API_KEY:-}"
          python - <<'PY'
          import json, os
          p=json.load(open('experiments/protocols/amem-adversarial-v4-full-v1.json'))
          m=json.load(open('benchmarks/algorithm-development/adversarial-v4/postfreeze-discrimination-manifest.json'))
          assert p['status']=='FROZEN_BEFORE_A_MEM_V4_RESULTS'
          assert p['benchmark']['scope']=='ALL_CASES'
          assert p['benchmark']['sha256']==os.environ['EXPECTED_CORPUS_SHA256']
          assert p['execution']['shard_count']==8
          assert p['execution']['exactly_all_24_cases_required'] is True
          assert p['integrity']['candidate_changed_for_v4'] is False
          assert p['integrity']['sealed_final_accessed'] is False
          assert p['execution']['new_monetary_cost_usd']==0.0
          assert m['status']=='FROZEN_BEFORE_ANY_V4_SYSTEM_EVALUATION'
          assert m['corpus_sha256']==os.environ['EXPECTED_CORPUS_SHA256']
          assert m['case_count']==24
          PY
          mkdir -p amem-v4-artifact
          printf '{"new_monetary_cost_usd":0.0,"paid_api_used":false,"cloud_gpu_used":false,"sealed_final_accessed":false}\n' > amem-v4-artifact/cost.json
      - name: Install and pin Ollama model
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > amem-v4-artifact/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          ollama pull qwen2.5:3b
          curl -fsS http://127.0.0.1:11434/api/tags > amem-v4-artifact/ollama-tags.json
          python - <<'PY'
          import json, os
          tags=json.load(open('amem-v4-artifact/ollama-tags.json'))
          model=next(row for row in tags['models'] if row['name']=='qwen2.5:3b')
          assert model['digest']==os.environ['EXPECTED_OLLAMA_DIGEST']
          PY
      - name: Clone exact-pinned A-MEM and install runtime
        run: |
          set -euo pipefail
          git clone https://github.com/WujiangXu/A-mem.git upstream-amem
          cd upstream-amem
          git checkout "$A_MEM_SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$A_MEM_SOURCE_COMMIT"
          cd ..
          python -m pip install -e .
          python -m pip install -r upstream-amem/requirements.txt
          python -m pip freeze > amem-v4-artifact/pip-freeze.txt
      - name: Preload and verify exact embedding snapshot
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          expected=os.environ['EXPECTED_EMBEDDING_SNAPSHOT']
          path=snapshot_download('sentence-transformers/all-MiniLM-L6-v2', revision=expected)
          observed=path.rstrip('/').split('/')[-1]
          assert observed==expected, (observed, expected)
          open('amem-v4-artifact/embedding-snapshot.txt','w').write(observed+'\n')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as handle:
              handle.write(f'EMBEDDING_MODEL_PATH={path}\n')
          PY
      - name: Execute exact A-MEM v4 shard
        env:
          PYTHONHASHSEED: "17"
        run: |
          set -euo pipefail
          /usr/bin/time -v -o amem-v4-artifact/time-shard-${{ matrix.shard }}.txt \
            python scripts/run_amem_adversarial_v4.py \
              --corpus benchmarks/algorithm-development/adversarial-v4/postfreeze-discrimination.json \
              --protocol experiments/protocols/amem-adversarial-v4-full-v1.json \
              --upstream-dir upstream-amem \
              --output amem-v4-artifact/shard-${{ matrix.shard }}.json \
              --shard-index ${{ matrix.shard }} \
              --shard-count 8 \
              --model qwen2.5:3b \
              --backend ollama \
              --embedding-model "$EMBEDDING_MODEL_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amem-v4-shard-${{ matrix.shard }}
          path: amem-v4-artifact/
          if-no-files-found: error
          retention-days: 7

  aggregate-and-persist:
    runs-on: ubuntu-latest
    needs: shard
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/personal-state-engine-v0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: amem-v4-shard-*
          path: downloaded-shards
          merge-multiple: true
      - name: Install package and aggregate fail-closed comparison
        run: |
          set -euo pipefail
          python -m pip install -e .
          python scripts/aggregate_amem_adversarial_v4.py \
            --corpus benchmarks/algorithm-development/adversarial-v4/postfreeze-discrimination.json \
            --protocol experiments/protocols/amem-adversarial-v4-full-v1.json \
            --shards downloaded-shards \
            --output-root results/strong-baseline/amem-adversarial-v4-full-v1 \
            --run-id "$GITHUB_RUN_ID" \
            --embedding-snapshot 1110a243fdf4706b3f48f1d95db1a4f5529b4d41 \
            --ollama-digest 357c53fb659c5076de1d65ccb0b397446227b71a42be9d1603d46168015c9e4b
          cat results/strong-baseline/amem-adversarial-v4-full-v1/comparison-run1.json
      - name: Verify durable full-corpus contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('results/strong-baseline/amem-adversarial-v4-full-v1')
          comp=json.load(open(root/'comparison-run1.json'))
          reg=json.load(open(root/'artifact-registry.json'))
          assert comp['case_count']==24 and comp['answerable_case_count']==22
          assert comp['algorithm_parity']=='NO'
          assert comp['sealed_final_accessed'] is False
          assert comp['new_monetary_cost_usd']==0.0
          assert set(comp['systems'])=={'pse_current_reconstruction','pse_candidate_v1','pse_candidate_v2','a_mem_exact','bm25_local','tfidf_local','random','recency'}
          for row in reg['artifacts']:
              p=pathlib.Path(row['path'])
              assert p.is_file(), p
              assert p.stat().st_size==row['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256']
          PY
      - name: Persist exact A-MEM v4 evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/strong-baseline/amem-adversarial-v4-full-v1
          if git diff --cached --quiet; then
            echo "No new A-MEM v4 evidence to commit."
            exit 0
          fi
          git commit -m "research: record exact A-MEM adversarial v4 evidence"
          git push origin HEAD:research/personal-state-engine-v0
