name: Bootstrap LongMemEval Faithful-Port v3

on:
  push:
    branches: [research/personal-state-engine-v0]
    paths:
      - .github/workflows/bootstrap-longmemeval-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-longmemeval-v3
  cancel-in-progress: false

jobs:
  integrate:
    if: github.repository == 'kodlbegiko/personal-state-engine-research'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/personal-state-engine-v0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run verified integration
        run: bash .bootstrap/integrate-v3.sh
