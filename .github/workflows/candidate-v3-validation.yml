name: Candidate v3 Frozen Validation

on:
  push:
    branches: [research/personal-state-engine-v0]
    paths:
      - research-triggers/candidate-v3-validation-v1.txt

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Verify frozen candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum src/personal_state_engine/candidate_v3.py | awk '{print $1}')" = "8e0ba9d818804d3f032f6e9f19d6768207a020dea9def52e78755cd7f4a38284"
          test "$(sha256sum experiments/protocols/candidate-v3-design-preregistration-v1.json | awk '{print $1}')" = "61c49cfadcf7c1fac7fcd0bfaa0444b037d1ee3bb4b36f009f822e8aec0b0144"
      - name: Run candidate v3 regression tests
        run: python -m unittest tests.test_candidate_v3 -v
      - name: One-time frozen validation
        run: |
          mkdir -p /tmp/candidate-v3-validation
          python scripts/evaluate_candidate_v3.py \
            --split validation \
            --output /tmp/candidate-v3-validation/validation-v1.json
      - name: Validation acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/candidate-v3-validation/validation-v1.json').read_text())
          r = p['results']['pse_candidate_v3']
          m = r['metrics']
          d = r['decision_metrics']
          assert m['recall@1'] >= 0.90, m
          assert d['false_abstention_rate'] <= 0.10, d
          assert d['abstention_accuracy'] >= 0.60, d
          assert p['integrity']['candidate_v2_changed'] is False
          assert p['integrity']['sealed_final_accessed'] is False
          assert p['integrity']['new_monetary_cost_usd'] == 0.0
          print('CANDIDATE_V3_FROZEN_VALIDATION_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-v3-validation-v1
          path: /tmp/candidate-v3-validation/
          retention-days: 30
          if-no-files-found: error
