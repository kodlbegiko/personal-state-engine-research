name: Candidate-v5 Development Evidence

on:
  push:
    branches: [research/personal-state-engine-v0]
    paths:
      - 'src/personal_state_engine/candidate_v5.py'
      - 'tests/test_candidate_v5.py'
      - 'scripts/evaluate_candidate_v5.py'
      - 'benchmarks/algorithm-development/candidate-v5-dev-v1/**'
      - 'experiments/protocols/candidate-v5-design-preregistration-v1.json'
      - '.github/workflows/candidate-v5.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/personal_state_engine/candidate_v5.py'
      - 'tests/test_candidate_v5.py'
      - 'scripts/evaluate_candidate_v5.py'
      - 'benchmarks/algorithm-development/candidate-v5-dev-v1/**'
      - 'experiments/protocols/candidate-v5-design-preregistration-v1.json'
      - '.github/workflows/candidate-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository
        run: python -m pip install -e .
      - name: Compile Candidate-v5 surfaces
        run: python -m compileall -q src/personal_state_engine/candidate_v5.py scripts/evaluate_candidate_v5.py benchmarks/algorithm-development/candidate-v5-dev-v1/generator.py tests/test_candidate_v5.py
      - name: Run Candidate-v5 unit tests
        run: python -m unittest tests.test_candidate_v5 -v
      - name: Materialize and evaluate deterministic development benchmark
        run: |
          set -euo pipefail
          mkdir -p /tmp/candidate-v5-dev
          python scripts/evaluate_candidate_v5.py \
            --output /tmp/candidate-v5-dev/development-summary-v1.json \
            --materialize-cases /tmp/candidate-v5-dev/cases.jsonl
          cp benchmarks/algorithm-development/candidate-v5-dev-v1/manifest.json /tmp/candidate-v5-dev/manifest.json
          cp experiments/protocols/candidate-v5-design-preregistration-v1.json /tmp/candidate-v5-dev/candidate-v5-design-preregistration-v1.json
          cp src/personal_state_engine/candidate_v5.py /tmp/candidate-v5-dev/candidate_v5.py
          sha256sum /tmp/candidate-v5-dev/* > /tmp/candidate-v5-dev/SHA256SUMS.txt
          cat /tmp/candidate-v5-dev/development-summary-v1.json
          cat /tmp/candidate-v5-dev/SHA256SUMS.txt
      - name: Verify repository stayed clean
        run: git diff --exit-code
      - name: Upload Candidate-v5 development evidence
        uses: actions/upload-artifact@v4
        with:
          name: candidate-v5-development-evidence
          path: /tmp/candidate-v5-dev/
          if-no-files-found: error
          retention-days: 30
