name: CI

on:
  push:
    branches: [main, research/personal-state-engine-v0]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src scripts experiments/runners tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Verify external E3 execution contract
        run: python scripts/verify_external_e3_contract.py
      - name: Verify LongMemEval faithful-port v3 raw evidence
        run: python scripts/verify_longmemeval_raw_evidence_v3.py
      - name: Regenerate LongMemEval faithful-port v3 preparation
        run: python scripts/prepare_longmemeval_faithful_port.py
      - name: Verify LongMemEval faithful-port v3 preparation
        run: python scripts/verify_longmemeval_faithful_port_preparation.py
      - name: Verify faithful-port v3 committed regeneration
        run: git diff --exit-code -- results/external/longmemeval-faithful-port-v3-preparation/
      - name: Verify faithful-port v3 evidence boundaries
        shell: bash
        run: |
          set -euo pipefail
          output='results/external/longmemeval-faithful-port-v3-preparation'
          test ! -e "$output/formal-rescoring.jsonl"
          test ! -e "$output/formal-summary.json"
          test ! -e "$output/paired-analysis.json"
          if find "$output" -type f \( -name '*.bin' -o -name '*.gguf' -o -name '*.onnx' -o -name '*.safetensors' -o -name '*.pt' -o -name '*.pth' \) | grep -q .; then
            echo 'model or dataset payload detected' >&2
            exit 1
          fi
          if grep -R -n -E 'sk-proj-|sk-live-|OPENAI_API_KEY=' "$output"; then
            echo 'secret marker detected' >&2
            exit 1
          fi
          if grep -R -n -E 'longmemeval-s-sealed_final|sealed[-_ ]final.*payload' "$output"; then
            echo 'sealed-final payload reference detected' >&2
            exit 1
          fi
      - name: Verify benchmark lock freshness
        run: |
          python scripts/freeze_pilot_benchmark.py
          git diff --exit-code -- benchmarks/pilot/benchmark-lock.json benchmarks/pilot/benchmark-lock.sha256
      - name: Verify benchmark lock
        run: python scripts/verify_benchmark_lock.py
      - name: Reproduce benchmark
        run: python scripts/run_benchmark.py
      - name: Run memory-write red team
        run: python scripts/run_redteam.py
      - name: Analyze component results
        run: python scripts/analyze_component_results.py
      - name: Verify committed benchmark outputs
        run: git diff --exit-code -- results/
