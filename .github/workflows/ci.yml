name: CI

on:
  push:
    branches: [main, research/personal-state-engine-v0]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src scripts experiments/runners tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Verify benchmark lock
        run: python scripts/verify_benchmark_lock.py
      - name: Reproduce benchmark
        run: python scripts/run_benchmark.py
      - name: Run memory-write red team
        run: python scripts/run_redteam.py
      - name: Analyze component results
        run: python scripts/analyze_component_results.py
      - name: Verify committed benchmark outputs
        run: git diff --exit-code -- results/
