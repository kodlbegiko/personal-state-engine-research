name: Candidate-v6 Materialize Development Benchmark

on:
  push:
    branches: [research/personal-state-engine-v0]
    paths:
      - 'benchmarks/algorithm-development/candidate-v6-development-v1/generate.py'
      - 'benchmarks/algorithm-development/candidate-v6-development-v1/manifest.json'
      - '.github/workflows/candidate-v6-materialize-development.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/personal-state-engine-v0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize deterministic cases
        run: |
          set -euo pipefail
          python benchmarks/algorithm-development/candidate-v6-development-v1/generate.py
          sha256sum benchmarks/algorithm-development/candidate-v6-development-v1/cases.jsonl
      - name: Verify manifest identity
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('benchmarks/algorithm-development/candidate-v6-development-v1')
          manifest = json.loads((root / 'manifest.json').read_text())
          digest = hashlib.sha256((root / 'cases.jsonl').read_bytes()).hexdigest()
          assert digest == manifest['expected_dataset_sha256'], (digest, manifest['expected_dataset_sha256'])
          assert sum(1 for _ in (root / 'cases.jsonl').open()) == manifest['case_count']
          print(digest)
          PY
      - name: Commit materialized benchmark if needed
        run: |
          set -euo pipefail
          if git diff --quiet -- benchmarks/algorithm-development/candidate-v6-development-v1/cases.jsonl && git ls-files --error-unmatch benchmarks/algorithm-development/candidate-v6-development-v1/cases.jsonl >/dev/null 2>&1; then
            echo 'cases.jsonl already materialized identically'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add benchmarks/algorithm-development/candidate-v6-development-v1/cases.jsonl
          git commit -m 'research: materialize candidate-v6 development benchmark'
          git push origin HEAD:research/personal-state-engine-v0
