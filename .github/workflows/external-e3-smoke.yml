name: External E3 Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-e3-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  longmemeval-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Python package
        run: python -m pip install -e .
      - name: Install exact Transformers.js runtime
        working-directory: experiments/runtime
        run: npm ci --ignore-scripts
      - name: Expose exact runtime to the model server
        run: ln -s experiments/runtime/node_modules node_modules
      - name: Record dependency audit
        run: |
          mkdir -p results/e3-smoke
          cd experiments/runtime
          npm audit --json > ../../results/e3-smoke/npm-audit.json || true
      - name: Download and verify pinned LongMemEval-S
        run: |
          python scripts/fetch_longmemeval.py \
            --manifest experiments/datasets/longmemeval-s-cleaned.json \
            --output-directory .external-data/longmemeval
      - name: Preload pinned real model and expose startup errors
        env:
          PSE_MODEL_ID: HuggingFaceTB/SmolLM2-135M-Instruct
          PSE_MODEL_REVISION: 12fd25f77366fa6b3b4b768ec3050bf629380bac
          PSE_MODEL_DTYPE: q4
          PSE_HF_CACHE: ${{ github.workspace }}/.external-data/hf-cache
        run: |
          node scripts/transformersjs_model_server.mjs </dev/null \
            > results/e3-smoke/model-preload.stdout.jsonl \
            2> results/e3-smoke/model-preload.stderr.log
          grep '"status":"ready"' results/e3-smoke/model-preload.stdout.jsonl
      - name: Run paired real-model EXT-B0 and EXT-B5 smoke
        env:
          TRANSFORMERS_CACHE: ${{ github.workspace }}/.external-data/hf-cache
        run: |
          python scripts/run_longmemeval_e3_smoke.py \
            .external-data/longmemeval/longmemeval_s_cleaned.json \
            --source-manifest experiments/datasets/longmemeval-s-cleaned.json \
            --model-manifest experiments/models/smollm2-135m-instruct-transformersjs.json \
            --run-manifest experiments/configs/smollm2-135m-e3-smoke.json \
            --model-server scripts/transformersjs_model_server.mjs \
            --cache-directory .external-data/hf-cache \
            --output-root results/e3-smoke \
            --smoke-cases 4 \
            --retrieval-k 1
      - name: Enrich and fail closed on E3 artifact provenance
        run: |
          python scripts/enrich_e3_artifact_registry.py \
            --output-root results/e3-smoke \
            --source-manifest experiments/datasets/longmemeval-s-cleaned.json \
            --model-manifest experiments/models/smollm2-135m-instruct-transformersjs.json \
            --run-manifest experiments/configs/smollm2-135m-e3-smoke.json \
            --source-head-sha "$GITHUB_SHA" \
            --tested-commit-sha "$GITHUB_SHA"
      - name: Verify no benchmark payload entered Git
        if: always()
        run: |
          git status --short
          test -z "$(git status --short -- .external-data)"
      - name: Upload complete E3 evidence or failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longmemeval-e3-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/e3-smoke/**
            experiments/runtime/package-lock.json
          if-no-files-found: warn
          retention-days: 14
