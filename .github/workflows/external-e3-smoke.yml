name: External E3 Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/external-e3-smoke.yml
      - scripts/run_longmemeval_e3_smoke.py
      - scripts/transformersjs_model_server.mjs
      - src/personal_state_engine/longmemeval.py
      - experiments/configs/smollm2-135m-e3-smoke.json
      - experiments/datasets/longmemeval-s-cleaned.json
      - experiments/models/smollm2-135m-instruct-transformersjs.json
      - experiments/runtime/package.json

permissions:
  contents: read

concurrency:
  group: external-e3-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  longmemeval-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Python package
        run: python -m pip install -e .
      - name: Install exact Transformers.js runtime
        working-directory: experiments/runtime
        run: npm install --ignore-scripts
      - name: Download and verify pinned LongMemEval-S
        run: |
          python scripts/fetch_longmemeval.py \
            --manifest experiments/datasets/longmemeval-s-cleaned.json \
            --output-directory .external-data/longmemeval
      - name: Run paired real-model EXT-B0 and EXT-B5 smoke
        env:
          TRANSFORMERS_CACHE: ${{ github.workspace }}/.external-data/hf-cache
        run: |
          python scripts/run_longmemeval_e3_smoke.py \
            .external-data/longmemeval/longmemeval_s_cleaned.json \
            --source-manifest experiments/datasets/longmemeval-s-cleaned.json \
            --model-manifest experiments/models/smollm2-135m-instruct-transformersjs.json \
            --run-manifest experiments/configs/smollm2-135m-e3-smoke.json \
            --model-server scripts/transformersjs_model_server.mjs \
            --cache-directory .external-data/hf-cache \
            --output-root results/e3-smoke \
            --smoke-cases 4 \
            --retrieval-k 1
      - name: Verify no benchmark payload entered Git
        if: always()
        run: |
          git status --short
          test -z "$(git status --short -- .external-data)"
      - name: Upload complete E3 evidence or failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longmemeval-e3-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/e3-smoke/**
            experiments/runtime/package-lock.json
          if-no-files-found: warn
          retention-days: 14
