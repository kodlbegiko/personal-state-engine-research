name: Adversarial v7 Stage 1 — Candidate-v6 Frozen Selection

on:
  push:
    branches: [research/personal-state-engine-v0]
    paths:
      - '.github/workflows/adversarial-v7-stage1.yml'

permissions:
  contents: read

jobs:
  stage1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository
        run: python -m pip install -e .
      - name: Verify frozen adversarial-v7 identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('benchmarks/algorithm-development/adversarial-v7-confirmatory')
          manifest=json.loads((root/'manifest-v1.json').read_text())
          assert manifest['status']=='FROZEN_BEFORE_ANY_SYSTEM_EXECUTION'
          assert manifest['system_execution_count_at_freeze']==0
          assert hashlib.sha256((root/'cases-v1.json').read_bytes()).hexdigest()==manifest['dataset_sha256']=='77f2113fdf67001c53a31f0d9eff4ecac7e71564335ab9a505665b44a05546cd'
          assert hashlib.sha256(Path('experiments/protocols/adversarial-v7-confirmatory-evaluation-v1.json').read_bytes()).hexdigest()==manifest['evaluation_protocol_sha256']
          assert hashlib.sha256(Path('experiments/protocols/adversarial-v7-statistics-v1.json').read_bytes()).hexdigest()==manifest['statistics_protocol_sha256']
          assert hashlib.sha256(Path('src/personal_state_engine/candidate_v6.py').read_bytes()).hexdigest()==manifest['candidate_v6_source_sha256']=='c540056c6f30f0145ab8ef8c10be3abcae2ed24e6a087a2d9a3531bc5e545325'
          assert hashlib.sha256(Path('experiments/configs/candidate-v6-v1.json').read_bytes()).hexdigest()==manifest['candidate_v6_config_sha256']=='067bfa64d97bf2eb1f7208082c36d202118a0e50a2414fc345bf328f83cab5b1'
          print('ADVERSARIAL_V7_FROZEN_IDENTITIES_PASS')
          PY
      - name: Execute Stage 1 exactly once
        id: stage1
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/adversarial-v7-stage1
          set +e
          python experiments/runners/evaluate_adversarial_v7_stage1.py --output /tmp/adversarial-v7-stage1/stage1-results-v1.json > /tmp/adversarial-v7-stage1/stdout.txt 2> /tmp/adversarial-v7-stage1/stderr.txt
          rc=$?
          set -e
          printf '%s\n' "$rc" > /tmp/adversarial-v7-stage1/exit-code.txt
          cat /tmp/adversarial-v7-stage1/stdout.txt || true
          cat /tmp/adversarial-v7-stage1/stderr.txt >&2 || true
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "Stage-1 infrastructure error: $rc" >&2
            exit "$rc"
          fi
      - name: Hash Stage-1 evidence and verify clean worktree
        if: always()
        run: |
          set -euo pipefail
          (cd /tmp/adversarial-v7-stage1 && sha256sum * > SHA256SUMS.txt)
          cat /tmp/adversarial-v7-stage1/SHA256SUMS.txt
          git diff --exit-code
      - name: Upload Stage-1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-v7-stage1-candidate-v6
          path: /tmp/adversarial-v7-stage1/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce frozen Stage-1 selection verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rc="$(cat /tmp/adversarial-v7-stage1/exit-code.txt)"
          if [ "$rc" -eq 0 ]; then
            echo 'ADVERSARIAL_V7_STAGE1_PASS_STAGE2_AUTHORIZED'
            exit 0
          fi
          if [ "$rc" -eq 2 ]; then
            echo 'ADVERSARIAL_V7_STAGE1_FAIL_CANDIDATE_V6_REJECTED' >&2
            exit 2
          fi
          exit "$rc"
