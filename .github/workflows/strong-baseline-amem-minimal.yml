name: A-MEM Exact Minimal Runtime Smoke

on:
  push:
    branches:
      - research/personal-state-engine-v0
    paths:
      - ".github/amem-minimal-trigger"

permissions:
  contents: read

jobs:
  exact-minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Capture environment
        run: |
          mkdir -p amem-minimal-artifact
          {
            uname -a
            python --version
            free -h
            df -h
          } | tee amem-minimal-artifact/environment.txt
      - name: Enforce zero-cost boundary before inference
        run: |
          test -z "${OPENAI_API_KEY:-}"
          test -z "${ANTHROPIC_API_KEY:-}"
          printf '{"new_monetary_cost_usd":0.0,"paid_api_used":false,"cloud_gpu_used":false}\n' > amem-minimal-artifact/cost.json
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > amem-minimal-artifact/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          ollama pull qwen2.5:3b
          ollama list | tee amem-minimal-artifact/ollama-list.txt
          ollama --version | tee amem-minimal-artifact/ollama-version.txt
          curl -fsS http://127.0.0.1:11434/api/tags > amem-minimal-artifact/ollama-tags.json
      - name: Clone exact-pinned A-MEM
        run: |
          git clone https://github.com/WujiangXu/A-mem.git upstream-amem
          cd upstream-amem
          git checkout 0c8039f28fdcc08189a23c07a3437d9d2482f9c2
          test "$(git rev-parse HEAD)" = "0c8039f28fdcc08189a23c07a3437d9d2482f9c2"
          git rev-parse HEAD | tee ../amem-minimal-artifact/upstream-head.txt
      - name: Install exact-upstream dependencies
        run: |
          python -m pip install -r upstream-amem/requirements.txt
          python -m pip freeze > amem-minimal-artifact/pip-freeze.txt
      - name: Execute exact upstream memory and standard retrieval API
        working-directory: upstream-amem
        env:
          PYTHONHASHSEED: "17"
        run: |
          /usr/bin/time -v -o ../amem-minimal-artifact/time.txt python - <<'PY'
          import json
          import time
          from pathlib import Path
          from memory_layer_robust import RobustAgenticMemorySystem

          out = Path('../amem-minimal-artifact/minimal-result.json')
          started = time.perf_counter()
          system = RobustAgenticMemorySystem(
              model_name='all-MiniLM-L6-v2',
              llm_backend='ollama',
              llm_model='qwen2.5:3b',
          )
          first = system.add_note('User preferred coffee for morning drinks.', time='202501010900')
          second = system.add_note('User changed morning drink preference to tea.', time='202606010900')
          retrieval_text, indices = system.find_related_memories('What is the current morning drink preference?', k=2)
          retrieval_indices = [int(index) for index in indices.tolist()]
          payload = {
              'source_commit': '0c8039f28fdcc08189a23c07a3437d9d2482f9c2',
              'backend': 'ollama',
              'llm_model': 'qwen2.5:3b',
              'embedding_model': 'all-MiniLM-L6-v2',
              'memory_count': len(system.memories),
              'memory_ids_created': [first, second],
              'retrieval_indices': retrieval_indices,
              'retrieval_nonempty': len(retrieval_indices) > 0,
              'retrieval_text': retrieval_text,
              'wall_seconds_python': time.perf_counter() - started,
              'note': 'Uses upstream find_related_memories(), the same standard retrieval API used by AMemUpstreamAdapter. Prior failures are retained: raw-neighborhood API IndexError, then wrapper-only NumPy truth-value error after successful standard retrieval.'
          }
          out.write_text(json.dumps(payload, indent=2, default=str) + '\n', encoding='utf-8')
          assert payload['memory_count'] == 2
          assert payload['retrieval_nonempty']
          PY
      - name: Capture resolved embedding snapshot and disk state
        if: always()
        run: |
          find "$HOME/.cache/huggingface/hub/models--sentence-transformers--all-MiniLM-L6-v2/snapshots" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort > amem-minimal-artifact/all-MiniLM-L6-v2-snapshots.txt || true
          du -sh "$HOME/.cache/huggingface" 2>/dev/null > amem-minimal-artifact/huggingface-cache-size.txt || true
          df -h > amem-minimal-artifact/disk-after.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amem-exact-minimal-runtime-smoke-v3
          path: amem-minimal-artifact/
          if-no-files-found: error
