name: Candidate v4 Development Evidence

on:
  push:
    branches: [research/personal-state-engine-v0]
    paths:
      - research-triggers/candidate-v4-development-v1.txt

permissions:
  contents: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Candidate v4 unit tests
        run: python -m unittest tests.test_candidate_v4 -v
      - name: Generate Candidate v4 development evidence
        run: |
          mkdir -p /tmp/candidate-v4-development
          python scripts/evaluate_candidate_v4.py \
            --split development \
            --output /tmp/candidate-v4-development/development-v1.json
      - name: Development acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/candidate-v4-development/development-v1.json').read_text())
          assert p['acceptance'] == 'PASS', p['guardrail_checks']
          assert all(p['guardrail_checks'].values()), p['guardrail_checks']
          assert p['integrity']['candidate_v2_changed'] is False
          assert p['integrity']['candidate_v3_changed'] is False
          assert p['integrity']['sealed_final_accessed'] is False
          assert p['integrity']['new_monetary_cost_usd'] == 0.0
          print('CANDIDATE_V4_DEVELOPMENT_ACCEPTANCE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-v4-development-v1
          path: /tmp/candidate-v4-development/
          retention-days: 30
          if-no-files-found: error
