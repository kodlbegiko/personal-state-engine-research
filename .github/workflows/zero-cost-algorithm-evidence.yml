name: Zero-Cost Algorithm Evidence

on:
  push:
    branches: [research/personal-state-engine-v0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e .
      - name: Run zero-cost regression tests
        run: python -m unittest discover -s tests -v
      - name: Refresh fail-closed benchmark lock
        run: python scripts/freeze_pilot_benchmark.py
      - name: Verify benchmark lock
        run: python scripts/verify_benchmark_lock.py
      - name: Generate zero-cost algorithm evidence
        run: python scripts/run_zero_cost_algorithm_research.py
      - name: Verify zero-cost artifact registry
        run: python -m unittest tests.test_zero_cost_artifact_registry -v
      - name: Verify deterministic regeneration three times
        shell: bash
        run: |
          set -euo pipefail
          digest() {
            find results/zero-cost-algorithm -type f ! -name 'resource-accounting.json' ! -name 'artifact-registry.json' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1
          }
          first="$(digest)"
          python scripts/run_zero_cost_algorithm_research.py
          second="$(digest)"
          python scripts/run_zero_cost_algorithm_research.py
          third="$(digest)"
          test "$first" = "$second"
          test "$second" = "$third"
          printf '%s\n' "$first" > /tmp/zero-cost-evidence.sha256
      - name: Enforce integrity boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | grep -Eic 'sealed[-_]?final' || true)" -eq 0
          if find results/zero-cost-algorithm -type f \( -name '*.bin' -o -name '*.gguf' -o -name '*.onnx' -o -name '*.safetensors' -o -name '*.pt' -o -name '*.pth' \) | grep -q .; then
            echo 'model weights detected' >&2
            exit 1
          fi
      - name: Commit benchmark lock refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/pilot/benchmark-lock.json benchmarks/pilot/benchmark-lock.sha256
          if ! git diff --cached --quiet; then
            git commit -m 'chore(benchmark): refresh lock for zero-cost algorithm executables'
          fi
      - name: Commit deterministic research evidence
        shell: bash
        run: |
          set -euo pipefail
          git add results/zero-cost-algorithm/baseline-results.json results/zero-cost-algorithm/ablation-results.json results/zero-cost-algorithm/statistical-analysis.json results/zero-cost-algorithm/failure-analysis.json results/zero-cost-algorithm/robustness-results.json results/zero-cost-algorithm/determinism-report.json results/zero-cost-algorithm/reproduction-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'research: record zero-cost algorithm evidence'
          fi
          git push origin HEAD:research/personal-state-engine-v0
      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: zero-cost-algorithm-evidence
          path: |
            results/zero-cost-algorithm/
            /tmp/zero-cost-evidence.sha256
