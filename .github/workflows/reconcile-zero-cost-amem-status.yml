name: Reconcile Zero-Cost A-MEM Status

on:
  workflow_dispatch:
  push:
    branches:
      - research/personal-state-engine-v0
    paths:
      - ".github/reconcile-zero-cost-trigger"

permissions:
  contents: write

concurrency:
  group: reconcile-zero-cost-amem-status
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/personal-state-engine-v0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Regenerate from source of truth
        run: |
          python scripts/run_zero_cost_algorithm_research.py
          python scripts/refresh_zero_cost_artifact_registry.py
      - name: Require all non-status evidence to remain byte-identical
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            results/zero-cost-algorithm/ablation-results.json \
            results/zero-cost-algorithm/statistical-analysis.json \
            results/zero-cost-algorithm/failure-analysis.json \
            results/zero-cost-algorithm/robustness-results.json \
            results/zero-cost-algorithm/determinism-report.json
      - name: Verify intended status and registry delta
        run: |
          set -euo pipefail
          git diff -- \
            results/zero-cost-algorithm/baseline-results.json \
            results/zero-cost-algorithm/reproduction-status.json \
            results/zero-cost-algorithm/artifact-registry.json
          python - <<'PY'
          import hashlib, json, pathlib
          b=json.load(open('results/zero-cost-algorithm/baseline-results.json'))
          r=json.load(open('results/zero-cost-algorithm/reproduction-status.json'))
          reg=json.load(open('results/zero-cost-algorithm/artifact-registry.json'))
          assert b['claims_boundary']['A-MEM']['status']=='EXECUTED_FROZEN_24_UNDERPOWERED'
          assert b['claims_boundary']['algorithm_parity']=='NO'
          assert b['claims_boundary']['sealed_final_accessed'] is False
          assert r['A_MEM_D1']=='COMPLETE'
          assert r['A_MEM_D2']=='COMPLETE'
          assert r['A_MEM_D3']=='COMPLETE'
          assert r['A_MEM_D4']=='NOT_COMPLETE'
          assert r['A_MEM_verdict']=='D3_COMPLETE_D4_PENDING'
          assert r['algorithm_parity']=='NO'
          assert r['paid_api_used'] is False
          assert r['cloud_gpu_used'] is False
          assert r['sealed_final_accessed'] is False
          assert reg['sealed_final_accessed'] is False
          assert reg['paid_api_cost_usd']==0.0
          assert all('sealed-final' not in row['path'] and 'sealed_final' not in row['path'] for row in reg['artifacts'])
          for row in reg['artifacts']:
              p=pathlib.Path(row['path'])
              assert p.is_file(), p
              assert p.stat().st_size==row['bytes'], p
              assert hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256'], p
          PY
      - name: Persist regenerated status evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            results/zero-cost-algorithm/baseline-results.json \
            results/zero-cost-algorithm/reproduction-status.json \
            results/zero-cost-algorithm/artifact-registry.json
          if git diff --cached --quiet; then
            echo "Status evidence and registry already reconciled."
            exit 0
          fi
          git commit -m "research: reconcile durable A-MEM D2 D3 registry"
          git push origin HEAD:research/personal-state-engine-v0
