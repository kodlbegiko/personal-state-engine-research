name: Candidate-v6 Protected Validation — One Formal Execution

on:
  push:
    branches: [research/personal-state-engine-v0]
    paths:
      - '.github/workflows/candidate-v6-protected-validation-once.yml'

permissions:
  contents: read

jobs:
  protected-validation-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository
        run: python -m pip install -e .
      - name: Verify frozen protected-validation lock before execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('benchmarks/algorithm-development/candidate-v6-validation-v1')
          lock = json.loads((root/'benchmark-lock.json').read_text())
          files = {
              'dataset_sha256': root/'cases.jsonl',
              'generator_sha256': root/'generator.py',
              'evaluator_sha256': root/'evaluate_once.py',
              'manifest_sha256': root/'manifest.json',
              'candidate_v6_source_sha256': Path('src/personal_state_engine/candidate_v6.py'),
              'candidate_v6_config_sha256': Path('experiments/configs/candidate-v6-v1.json'),
              'candidate_v6_freeze_marker_sha256': Path('results/candidate-v6/freeze-marker-v1.json'),
          }
          assert lock['status'] == 'FROZEN_BEFORE_FORMAL_EXECUTION'
          assert lock['created_after_candidate_freeze'] is True
          assert lock['candidate_freeze_marker_commit'] == 'af88deb300693e109ef22ec24e22ec3ec31efaad'
          assert lock['formal_execution_count_allowed'] == 1
          assert lock['formal_execution_performed_at_lock_time'] is False
          assert lock['post_result_editing_allowed'] is False
          assert lock['post_result_candidate_tuning_allowed'] is False
          assert lock['sealed_final_accessed'] is False
          for key, path in files.items():
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == lock['hashes'][key], (key, actual, lock['hashes'][key])
          anchor = hashlib.sha256((root/'benchmark-lock.json').read_bytes()).hexdigest()
          recorded = (root/'benchmark-lock.sha256').read_text().split()[0]
          assert anchor == recorded
          assert lock['hashes']['dataset_sha256'] == '855f812b3eec93f3229fe804ebd20e6e86baee5f99e9b322d11c114821215dc7'
          assert lock['hashes']['candidate_v6_source_sha256'] == 'c540056c6f30f0145ab8ef8c10be3abcae2ed24e6a087a2d9a3531bc5e545325'
          assert lock['hashes']['candidate_v6_config_sha256'] == '067bfa64d97bf2eb1f7208082c36d202118a0e50a2414fc345bf328f83cab5b1'
          print('formal protected-validation preflight lock verification: PASS')
          PY
          test ! -e results/candidate-v6/validation-summary-v1.json
          test ! -e results/candidate-v6/validation-statistics-v1.json
      - name: Execute Candidate-v6 protected validation exactly once
        id: formal
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/candidate-v6-protected
          set +e
          python benchmarks/algorithm-development/candidate-v6-validation-v1/evaluate_once.py \
            --output-dir /tmp/candidate-v6-protected \
            > /tmp/candidate-v6-protected/evaluator-stdout.txt \
            2> /tmp/candidate-v6-protected/evaluator-stderr.txt
          rc=$?
          set -e
          printf '%s\n' "$rc" > /tmp/candidate-v6-protected/evaluator-exit-code.txt
          echo "evaluator_exit_code=$rc" >> "$GITHUB_OUTPUT"
          cat /tmp/candidate-v6-protected/evaluator-stdout.txt || true
          cat /tmp/candidate-v6-protected/evaluator-stderr.txt >&2 || true
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "Infrastructure/evaluator error before a valid frozen verdict: exit=$rc" >&2
            exit "$rc"
          fi
      - name: Enforce preregistered assertion-specific checks from immutable predictions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('/tmp/candidate-v6-protected')
          predictions = json.loads((out/'predictions-v1.json').read_text())
          config = json.loads(Path('experiments/configs/candidate-v6-v1.json').read_text())
          thresholds = config['selection_thresholds']

          groups = {
              'assertion_extraction_accuracy': [p for p in predictions if p['answerable']],
              'meta_discourse_rejection_accuracy': [p for p in predictions if p['category'] in {'agenda_only', 'review_topic'}],
              'explicit_no_value_detection_accuracy': [p for p in predictions if p['category'] == 'explicit_no_value'],
              'contradiction_detection_accuracy': [p for p in predictions if p['category'] == 'contradiction'],
              'temporal_resolution_accuracy': [p for p in predictions if p['category'] == 'stale_only'],
          }
          threshold_keys = {
              'assertion_extraction_accuracy': 'assertion_extraction_accuracy_min',
              'meta_discourse_rejection_accuracy': 'meta_discourse_rejection_accuracy_min',
              'explicit_no_value_detection_accuracy': 'explicit_no_value_detection_accuracy_min',
              'contradiction_detection_accuracy': 'contradiction_detection_accuracy_min',
              'temporal_resolution_accuracy': 'temporal_resolution_accuracy_min',
          }
          metrics = {}
          checks = {}
          for name, rows in groups.items():
              assert rows, name
              correct = sum(bool(p['candidate_v6_verdict_match']) for p in rows)
              accuracy = correct / len(rows)
              minimum = thresholds[threshold_keys[name]]
              metrics[name] = {'correct': correct, 'n': len(rows), 'accuracy': accuracy, 'minimum': minimum}
              checks[name] = accuracy >= minimum - 1e-12
          result = {
              'schema_version': 'candidate-v6-protected-assertion-guardrails-v1',
              'computed_from_single_formal_execution_predictions': True,
              'candidate_rerun_performed': False,
              'metrics': metrics,
              'checks': checks,
              'all_pass': all(checks.values()),
          }
          (out/'assertion-guardrails-v1.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Record immutable evidence hashes and verify clean repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /tmp/candidate-v6-protected ]; then
            (cd /tmp/candidate-v6-protected && sha256sum * > SHA256SUMS.txt)
            cat /tmp/candidate-v6-protected/SHA256SUMS.txt
          fi
          git diff --exit-code
      - name: Upload immutable formal protected-validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-v6-protected-validation-one-formal-execution
          path: /tmp/candidate-v6-protected/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce frozen formal verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rc="$(cat /tmp/candidate-v6-protected/evaluator-exit-code.txt)"
          assertion_pass="$(python - <<'PY'
          import json
          from pathlib import Path
          print('true' if json.loads(Path('/tmp/candidate-v6-protected/assertion-guardrails-v1.json').read_text())['all_pass'] else 'false')
          PY
          )"
          if [ "$rc" -eq 0 ] && [ "$assertion_pass" = 'true' ]; then
            echo 'PROTECTED_VALIDATION_PASS'
            exit 0
          fi
          if [ "$rc" -eq 2 ] || [ "$assertion_pass" != 'true' ]; then
            echo 'PROTECTED_VALIDATION_FAIL_CANDIDATE_V6_REMAINS_FROZEN' >&2
            exit 2
          fi
          echo "unexpected evaluator exit code: $rc" >&2
          exit "$rc"
