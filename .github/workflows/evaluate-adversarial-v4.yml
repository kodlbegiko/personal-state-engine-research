name: Evaluate Adversarial-v4 Discrimination

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/personal-state-engine-v0
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Fail closed on pre-result benchmark and candidate freeze
        run: |
          set -euo pipefail
          test -f benchmarks/algorithm-development/adversarial-v4/postfreeze-discrimination-manifest.json
          git merge-base --is-ancestor d627f61d0888306a97f3ef0b78aa29dc00c444bb HEAD
          test "$(sha256sum benchmarks/algorithm-development/adversarial-v4/postfreeze-discrimination.json | awk '{print $1}')" = "02e3afef1e17d9d8991ea7172cbfc19ad239874c914a088c20e5de6a146f7a1d"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${ANTHROPIC_API_KEY:-}"
          python - <<'PY'
          import json
          m=json.load(open('benchmarks/algorithm-development/adversarial-v4/postfreeze-discrimination-manifest.json'))
          p=json.load(open('experiments/protocols/adversarial-v4-evaluation-v1.json'))
          assert m['status']=='FROZEN_BEFORE_ANY_V4_SYSTEM_EVALUATION'
          assert m['candidate_source_changed_for_v4'] is False
          assert m['candidate_v2_freeze_commit']=='d627f61d0888306a97f3ef0b78aa29dc00c444bb'
          assert m['case_count']==24 and m['answerable_case_count']==22 and m['abstention_case_count']==2
          assert p['status']=='FROZEN_BEFORE_V4_SYSTEM_RESULTS'
          assert p['integrity']['sealed_final_accessed'] is False
          assert p['integrity']['new_monetary_cost_usd']==0.0
          PY
      - name: Evaluate all frozen zero-cost systems
        run: |
          set -euo pipefail
          python scripts/evaluate_adversarial_v4.py \
            --corpus benchmarks/algorithm-development/adversarial-v4/postfreeze-discrimination.json \
            --manifest benchmarks/algorithm-development/adversarial-v4/postfreeze-discrimination-manifest.json \
            --protocol experiments/protocols/adversarial-v4-evaluation-v1.json \
            --output-root results/algorithm-development/adversarial-v4
          cat results/algorithm-development/adversarial-v4/results.json
      - name: Verify generated artifact registry
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('results/algorithm-development/adversarial-v4')
          result=json.load(open(root/'results.json'))
          reg=json.load(open(root/'artifact-registry.json'))
          assert result['case_count']==24
          assert result['candidate_v2_changed_for_v4'] is False
          assert result['algorithm_parity']=='NO'
          assert result['sealed_final_accessed'] is False
          assert result['new_monetary_cost_usd']==0.0
          assert reg['sealed_final_accessed'] is False
          for row in reg['artifacts']:
              p=pathlib.Path(row['path'])
              assert p.is_file(), p
              assert p.stat().st_size==row['bytes']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==row['sha256']
          PY
      - name: Persist post-freeze v4 evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/algorithm-development/adversarial-v4
          if git diff --cached --quiet; then
            echo "No new v4 evidence to commit."
            exit 0
          fi
          git commit -m "research: record adversarial v4 discrimination evidence"
          git push origin HEAD:research/personal-state-engine-v0
