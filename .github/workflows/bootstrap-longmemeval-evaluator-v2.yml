name: Cleanup LongMemEval Evaluator Bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-longmemeval-evaluator-v2.yml

permissions:
  contents: write

jobs:
  cleanup-bootstrap-assets:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/personal-state-engine-v0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/personal-state-engine-v0
          fetch-depth: 0
      - name: Verify durable evaluator evidence before cleanup
        run: |
          test -f results/external/longmemeval-evaluator-v2/evaluator-calibration.json
          test -f results/external/longmemeval-evaluator-v2/formal-summary.json
          python scripts/verify_longmemeval_evaluator_v2_contract.py \
            results/external/longmemeval-evaluator-v2 \
            --evidence-root results/external/longmemeval-development-matrix-30676516785
      - name: Remove transport-only bundle files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch \
            .github/evaluator-v2-bundle \
            .github/evaluator-v2-source-bundle
          git diff --cached --quiet && exit 0
          git commit -m "chore(evaluation): remove evaluator bootstrap bundles"
          git push origin HEAD:research/personal-state-engine-v0
